name: Generate Preset Index

on:
  push:
    branches: [ main, master ]
    paths:
      - '_preset/*.json'
      - '.github/workflows/generate-index.yml'
  workflow_dispatch:

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Generate index.json
        run: |
          cd _preset
          python3 -c "
          import os, json
          files = [f for f in sorted(os.listdir('.')) if f.endswith('.json') and f != 'index.json']
          with open('index.json', 'w', encoding='utf-8') as out:
              json.dump(files, out, indent=2, ensure_ascii=False)
          print('Successfully generated index.json with:', files)
          "

      - name: Commit & Push index.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update _preset/index.json [skip ci]"
          file_pattern: "_preset/index.json"
